<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Practice - Messiaen</title>
    <!-- ABC.js for professional music notation -->
    <script src="https://unpkg.com/abcjs@6.4.0/dist/abcjs-basic.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .mode-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .mode-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f0f0f0;
            color: #333;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .chord-display {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .generate-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(79, 172, 254, 0.4);
        }

        .staff-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        #staff {
            width: 100%;
            height: 200px;
        }

        .info-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .info-panel h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .chord-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .chord-item {
            background: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9em;
            border-left: 3px solid #667eea;
        }

        .pitch-info {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.9em;
            color: #1976d2;
        }

        .voicing-info {
            background: #fff3e0;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.9em;
            color: #e65100;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Chord Practice</h1>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('II')">Mode II</button>
            <button class="mode-btn" onclick="setMode('III')">Mode III</button>
        </div>

        <div class="chord-display" id="chordDisplay">
            Click "Generate Chord" to start
        </div>

        <button class="generate-btn" onclick="generateChord()">Generate Chord</button>

        <div class="staff-container">
            <div id="staff"></div>
        </div>

        <div class="info-panel">
            <h3>Current Mode: <span id="currentMode">II</span></h3>
            <div class="pitch-info">
                <strong>Random Pitch:</strong> <span id="currentPitch">-</span>
            </div>
            <div class="voicing-info" id="voicingInfo">
                <strong>Chord Voicing:</strong> <span id="voicingNotes">-</span>
            </div>
            <div class="chord-list" id="chordList">
                <!-- Chord types will be displayed here -->
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'II';
        const pitches = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        
        // Pitch mapping for transposition - matching BPP web version
        const pitchClasses = {
            "C": 0, "Db": 1, "C#": 1, "D": 2, "Eb": 3, "D#": 3, "E": 4,
            "F": 5, "Gb": 6, "F#": 6, "G": 7, "Ab": 8, "G#": 8, "A": 9,
            "Bb": 10, "A#": 10, "B": 11
        };
        
        const PITCH_CLASSES_SHARP = {0: "C", 1: "C#", 2: "D", 3: "D#", 4: "E", 5: "F",
                                     6: "F#", 7: "G", 8: "G#", 9: "A", 10: "A#", 11: "B"};
        const PITCH_CLASSES_FLAT = {0: "C", 1: "Db", 2: "D", 3: "Eb", 4: "E", 5: "F",
                                    6: "Gb", 7: "G", 8: "Ab", 9: "A", 10: "Bb", 11: "B"};
        const FLAT_KEYS = new Set(["Db", "Ab", "Eb", "Bb", "F", "C"]);

        // Chord voicings in C (from bottom to top)
        const chordVoicings = {
            'II': {
                'CII6': ['G3', 'C4', 'E4', 'A4'],
                'CII#11': ['G3', 'C4', 'E4', 'F#4'],
                'CII13': ['C4', 'E4', 'A4', 'Bb4']
            },
            'III': {
                'CIII-7': ['Bb4', 'C5', 'Eb5', 'G5', 'B5'],
                'CIII-9': ['Bb4', 'C5', 'Eb5', 'G5', 'B5', 'D6'],
                'CIII-9(#11)': ['Bb4', 'C5', 'Eb5', 'G5', 'B5', 'D6', 'F#6'],
                'CIII7': ['G4', 'Bb4', 'C5', 'E5', 'G#5'],
                'CIII7/Δ7': ['G4', 'Bb4', 'C5', 'E5', 'G#5', 'B5'],
                'CIII7/Δ7/#9': ['G4', 'Bb4', 'C5', 'E5', 'G#5', 'B5', 'D#6'],
                'CIIIø7': ['C5', 'Eb5', 'Gb5', 'Bb5', 'D6'],
                'CIIIø7b13': ['C5', 'Eb5', 'Gb5', 'Bb5', 'D6', 'G#6'],
                'CIIIø7b13(♮3)': ['C5', 'Eb5', 'Gb5', 'Bb5', 'D6', 'E6', 'G#6']
            }
        };

        const modeIIChords = [
            'CII6',
            'CII#11',
            'CII13'
        ];

        const modeIIIChords = [
            'CIII-7',
            'CIII-9',
            'CIII-9(#11)',
            'CIII7',
            'CIII7/Δ7',
            'CIII7/Δ7/#9',
            'CIIIø7',
            'CIIIø7b13',
            'CIIIø7b13(♮3)'
        ];

        function transposeNote(note, semitones, key) {
            const pitch = note.slice(0, -1);
            const octave = parseInt(note.slice(-1));
            const pitchClass = pitchClasses[pitch];
            
            // Handle invalid notes
            if (pitchClass === undefined || isNaN(octave)) {
                console.error('Invalid note in transposeNote:', note);
                return note;
            }
            
            // Fix JavaScript modulo behavior for negative numbers - EXACT BPP logic
            const newPitch = ((pitchClass + semitones) % 12 + 12) % 12;
            const newOctave = octave + Math.floor((pitchClass + semitones) / 12);
            
            // Choose sharp/flat based on key - exact BPP logic
            const pitchClassMap = FLAT_KEYS.has(key) ? PITCH_CLASSES_FLAT : PITCH_CLASSES_SHARP;
            let pitchName = pitchClassMap[newPitch];
            
            // Special handling for certain keys - EXACT BPP logic
            if (["F#", "B", "E", "A", "D", "G"].includes(key)) {
                if (["Db", "Eb", "Gb", "Ab", "Bb"].includes(pitchName)) {
                    const sharpMap = {1: "C#", 3: "D#", 6: "F#", 8: "G#", 10: "A#"};
                    pitchName = sharpMap[newPitch] || pitchName;
                }
            }
            
            console.log(`Transposing ${note}: pitch=${pitch}(${pitchClass}) + ${semitones} = ${pitchName}(${newPitch}), octave=${octave} + ${Math.floor((pitchClass + semitones) / 12)} = ${newOctave}`);
            
            return `${pitchName}${newOctave}`;
        }

        function transposeChord(notes, semitones, key) {
            return notes.map(note => transposeNote(note, semitones, key));
        }

        function noteToLilyPond(note) {
            const pitch = note.slice(0, -1);
            const octave = parseInt(note.slice(-1));
            
            console.log(`🔧 Converting note: ${note} -> pitch: ${pitch}, octave: ${octave}`);
            
            // Convert pitch names to LilyPond format
            const pitchMap = {
                'C': 'c', 'C#': 'cis', 'D': 'd', 'D#': 'dis', 'E': 'e', 'F': 'f', 
                'F#': 'fis', 'G': 'g', 'G#': 'gis', 'A': 'a', 'A#': 'ais', 'B': 'b'
            };
            
            // Handle flats
            const flatMap = {
                'Db': 'des', 'Eb': 'ees', 'Gb': 'ges', 'Ab': 'aes', 'Bb': 'bes'
            };
            
            let lilyNote;
            if (flatMap[pitch]) {
                lilyNote = flatMap[pitch];
            } else {
                lilyNote = pitchMap[pitch];
            }
            
            // Add octave markers - LilyPond uses apostrophes and commas
            if (octave <= 3) {
                // Add commas for lower octaves
                for (let i = 0; i < (4 - octave); i++) {
                    lilyNote = lilyNote + ',';
                }
            } else if (octave >= 5) {
                // Add apostrophes for higher octaves
                for (let i = 0; i < (octave - 4); i++) {
                    lilyNote = lilyNote + "'";
                }
            }
            // octave 4 stays as is
            
            console.log(`🎵 LilyPond result: ${note} -> ${lilyNote}`);
            return lilyNote;
        }

        function drawStaff(notes) {
            // Clear previous content
            const staffDiv = document.getElementById('staff');
            staffDiv.innerHTML = '';
            
            // Convert notes to ABC format using the BPP approach
            const abcNotes = convertToABCWithAccidentals(notes);
            
            console.log(`🎼 Original notes:`, notes);
            console.log(`🎼 ABC notes:`, abcNotes);
            
            // Create ABC chord notation: [CEGc]4
            const chordNotation = `[${abcNotes.join('')}]4`;
            
            console.log(`🎼 Chord notation: ${chordNotation}`);
            
            // Create ABC notation string
            const abcNotation = `X:1
T:Chord Practice
L:1/4
K:C
${chordNotation}`;
            
            console.log(`🎼 ABC notation:`, abcNotation);
            
            // Render with ABC.js using BPP approach
            try {
                ABCJS.renderAbc(staffDiv, abcNotation, {
                    responsive: "resize",
                    scale: 1.2,
                    staffwidth: 400,
                    paddingleft: 20,
                    paddingright: 20,
                    paddingtop: 20,
                    paddingbottom: 20,
                    add_classes: true,
                    format: {
                        titlefont: "serif 14",
                        gchordfont: "serif 10",
                        vocalfont: "serif 11"
                    }
                });
                
                console.log(`✅ ABC.js rendered successfully`);
                console.log(`Staff drawn successfully with notes:`, notes);
                
            } catch (error) {
                console.error(`❌ Error rendering ABC:`, error);
                staffDiv.innerHTML = `<p style="color: red;">Error rendering staff: ${error.message}</p>`;
            }
        }
        
        // Convert notes to ABC notation with proper accidental handling (from BPP)
        function convertToABCWithAccidentals(notes) {
            const accidentalState = {}; // Track accidentals by pitch class AND octave
            
            return notes.map(note => {
                const noteName = note.slice(0, -1);
                const octave = parseInt(note.slice(-1));
                
                const pitchClass = noteName[0]; // Base pitch class (C, D, E, F, G, A, B)
                const currentAccidental = noteName.length > 1 ? noteName[1] : null;
                
                // Create key that includes both pitch class and octave
                const accidentalKey = `${pitchClass}${octave}`;
                
                let baseNote = pitchClass.toLowerCase();
                let accidentalSymbol = "";
                
                // Determine what accidental symbol to use based on current state
                if (currentAccidental === "#") {
                    if (accidentalState[accidentalKey] !== "#") {
                        accidentalSymbol = "^"; // Sharp
                        accidentalState[accidentalKey] = "#";
                    }
                } else if (currentAccidental === "b") {
                    if (accidentalState[accidentalKey] !== "b") {
                        accidentalSymbol = "_"; // Flat
                        accidentalState[accidentalKey] = "b";
                    }
                } else {
                    // Natural note - only add natural sign if we need to cancel a previous accidental
                    if (accidentalState[accidentalKey] === "#" || accidentalState[accidentalKey] === "b") {
                        accidentalSymbol = "="; // Natural (cancels previous accidental)
                        accidentalState[accidentalKey] = "natural";
                    }
                }
                
                // Apply accidental symbol
                if (accidentalSymbol) {
                    baseNote = accidentalSymbol + baseNote;
                }
                
                // Handle octaves relative to octave 4 (middle octave in ABC)
                if (octave >= 5) {
                    // Higher octaves use apostrophes
                    const apostrophes = "'".repeat(octave - 4);
                    baseNote = baseNote + apostrophes;
                } else if (octave === 4) {
                    // Octave 4 stays as is (lowercase)
                    baseNote = baseNote;
                } else if (octave === 3) {
                    // Octave 3 uses uppercase
                    baseNote = baseNote.toUpperCase();
                } else if (octave <= 2) {
                    // Lower octaves use commas
                    baseNote = baseNote.toUpperCase();
                    const commas = ",".repeat(3 - octave);
                    baseNote = baseNote + commas;
                }
                
                return baseNote;
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('currentMode').textContent = mode;
            
            // Update button states
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update chord list
            updateChordList();
            
            // Clear display
            document.getElementById('chordDisplay').textContent = 'Click "Generate Chord" to start';
            document.getElementById('currentPitch').textContent = '-';
            document.getElementById('voicingNotes').textContent = '-';
            document.getElementById('staff').innerHTML = '';
        }

        function updateChordList() {
            const chordList = document.getElementById('chordList');
            const chords = currentMode === 'II' ? modeIIChords : modeIIIChords;
            
            chordList.innerHTML = chords.map(chord => 
                `<div class="chord-item">${chord}</div>`
            ).join('');
        }

        function generateChord() {
            const randomPitch = pitches[Math.floor(Math.random() * pitches.length)];
            const chords = currentMode === 'II' ? modeIIChords : modeIIIChords;
            const randomChord = chords[Math.floor(Math.random() * chords.length)];
            
            // Replace 'C' with the random pitch
            const finalChord = randomChord.replace('C', randomPitch);
            
            // Get the original voicing in C
            const originalVoicing = chordVoicings[currentMode][randomChord];
            
            // Calculate transposition semitones (C = 0, so target pitch number is the semitones to transpose)
            const transpositionSemitones = pitchClasses[randomPitch];
            
            // Transpose the voicing
            const transposedVoicing = transposeChord(originalVoicing, transpositionSemitones, randomPitch);
            
            // Display results
            document.getElementById('chordDisplay').textContent = finalChord;
            document.getElementById('currentPitch').textContent = randomPitch;
            document.getElementById('voicingNotes').textContent = transposedVoicing.join(', ');
            
            console.log('Generated chord:', finalChord);
            console.log('Original voicing:', originalVoicing);
            console.log('Transposition semitones:', transpositionSemitones);
            console.log('Transposed voicing:', transposedVoicing);
            
            // Draw the chord on staff
            drawStaff(transposedVoicing);
        }

        // Initialize the page
        updateChordList();
    </script>
</body>
</html>
